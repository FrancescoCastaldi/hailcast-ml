name: Automated Radar & Convective Data Sync

on:
  schedule:
    # Esegue automaticamente ogni 15 minuti H24
    - cron: '*/15 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    name: Sync Radar Feeds & Deploy Snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch Live Radar & Convective Sounding Snapshot
        run: node scripts/sync-radar-data.mjs

      - name: Run Meteorological Verification Tests
        run: npm test

      - name: Commit Updated Radar Data (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/live-radar-feed.json
          git commit -m "chore(data): auto-update live radar and convective snapshot [skip ci]" || echo "Nessuna variazione nei dati radar"
          git push || echo "Push non necessario o già aggiornato"

      - name: Build Application Bundle
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
