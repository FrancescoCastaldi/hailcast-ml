<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c182e"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#neonCyan)" stroke-width="8" />
  
  <!-- Outer Neon Rings -->
  <circle cx="256" cy="256" r="220" stroke="url(#neonCyan)" stroke-width="3" opacity="0.4" stroke-dasharray="16 8"/>
  <circle cx="256" cy="256" r="195" stroke="url(#neonPurple)" stroke-width="2" opacity="0.3"/>

  <!-- Radar Wave Arcs -->
  <path d="M140 230 A 100 100 0 0 1 270 120" stroke="url(#neonCyan)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" opacity="0.85"/>
  <path d="M120 256 A 130 130 0 0 1 290 100" stroke="url(#neonCyan)" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <path d="M100 280 A 160 160 0 0 1 310 80" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" opacity="0.35"/>

  <!-- Radar Dish -->
  <g filter="url(#glow)">
    <ellipse cx="200" cy="220" rx="60" ry="38" transform="rotate(-30 200 220)" stroke="url(#neonCyan)" stroke-width="8" fill="rgba(0, 240, 255, 0.15)" />
    <line x1="200" y1="220" x2="235" y2="175" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="235" cy="175" r="9" fill="#00f0ff" stroke="#ffffff" stroke-width="3"/>
    <path d="M170 250 L145 300 L185 300 Z" fill="url(#neonCyan)" opacity="0.8"/>
  </g>

  <!-- Geometric Hail Crystal -->
  <g filter="url(#glow)" transform="translate(40, 20)">
    <polygon points="280,180 340,240 310,340 230,320 220,230" fill="rgba(168, 85, 247, 0.25)" stroke="url(#neonPurple)" stroke-width="7"/>
    <line x1="280" y1="180" x2="310" y2="340" stroke="url(#neonCyan)" stroke-width="3" opacity="0.7"/>
    <line x1="340" y1="240" x2="220" y2="230" stroke="url(#neonCyan)" stroke-width="3" opacity="0.7"/>
    <line x1="280" y1="180" x2="230" y2="320" stroke="url(#neonPurple)" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- Electric Lightning Bolt -->
  <polygon points="305,195 270,265 295,265 260,340 330,250 298,250" fill="#00f0ff" stroke="#ffffff" stroke-width="4" filter="url(#glow)"/>
</svg>
